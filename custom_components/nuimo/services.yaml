show:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: nuimo
          multiple: true
    icon:
      selector:
        select:
          options:
            - blank
            - bulb
            - check
            - cross
            - dot
            - down
            - full
            - heart
            - left
            - minus
            - moon
            - music
            - next
            - pause
            - play
            - plus
            - power
            - previous
            - right
            - sun
            - up
          translation_key: icon
    matrix:
      example: |
        ....#....
        ...###...
        ..#####..
        .#######.
        #########
        .........
        .........
        .........
        .........
      selector:
        text:
          multiline: true
    number:
      selector:
        number:
          min: 0
          max: 99
          mode: box
    level:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    brightness:
      default: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    duration:
      default: 2
      selector:
        number:
          min: 0.1
          max: 25.5
          step: 0.1
          unit_of_measurement: s
    fade:
      default: false
      selector:
        boolean:
