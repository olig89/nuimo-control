name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - name: Install the Bluetooth integration's own requirements (pinned by that HA version)
        run: |
          python - <<'PY' > bt-requirements.txt
          import json, pathlib, homeassistant.components as c
          root = pathlib.Path(c.__path__[0])
          for name in ("bluetooth", "bluetooth_adapters", "usb"):
              print("
".join(json.loads((root / name / "manifest.json").read_text()).get("requirements", [])))
          PY
          pip install -r bt-requirements.txt
      - run: python -m pytest -q
      - name: core/ must not import Home Assistant
        run: |
          if grep -rnE "^\s*(from|import) homeassistant" custom_components/nuimo/core; then
            echo "core/ imports homeassistant"; exit 1
          fi
